<script>
(function(){
 var root=document.getElementById('s09');if(!root)return;
 var cat=root.querySelector('#s09_cat'),eyes=root.querySelectorAll('.s09_eye'),tail=root.querySelector('.s09_tail'),head=root.querySelector('.s09_head'),sh=root.querySelector('#s09_sh'),sh2=root.querySelector('#s09_sh2');
 function seg(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)))}
 function bell(t,a,b){var u=seg(t,a,b);return Math.sin(u*Math.PI)}
 var T=7;
 function pose(t,still){
  // timeline: sit tall, a proud little bounce, a slow head tilt, two blinks
  var sq=0.05*bell(t,1.0,1.5)-0.045*bell(t,1.5,2.2)+0.025*bell(t,2.2,2.6);
  var bl=Math.max(bell(t,.55,.8),bell(t,5.3,5.55),bell(t,5.75,6.0));
  var tilt=5*bell(t,3.0,4.8),sw=5*Math.sin(t/T*Math.PI*4);
  if(still){sq=0;bl=0;tilt=0;sw=0}
  var eo=bl>.95?.06:1-bl*.9;
  for(var i=0;i<eyes.length;i++)eyes[i].style.transform='scaleY('+eo+')';
  tail.style.transform='rotate('+sw+'deg)';head.style.transform='rotate('+tilt+'deg)';
  // squash and stretch about the floor; tiny stop-motion "boil"
  var f=Math.floor(t*12),j1=(Math.sin(f*12.9898)*43758.5)%1,j2=(Math.sin(f*78.233)*12543.1)%1;
  if(still){j1=0;j2=0}
  var gx=296,gy=300;
  cat.setAttribute('transform','translate('+(gx+j1*.5)+','+(gy+j2*.4)+') scale('+(1+sq)+','+(1-sq)+') translate('+(-gx)+','+(-gy)+')');
  sh.setAttribute('rx',70*(1+sq));sh2.setAttribute('rx',44*(1+sq));
 }
 var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(rm){pose(0,true);return}
 var t0=performance.now()-400,last=-1;
 pose(0.4,false);
function tick(){
  var now=performance.now(),t=((now-t0)/1000)%T,f=Math.floor(t*12);
  if(f!==last){last=f;pose(f/12,false)}
  setTimeout(tick,1000/12);
 }
 setTimeout(tick,1000/12);
})();
</script>
