   <path d="M38,-12 L31,-48 L6,-34Z" fill="#6c4f3f" stroke="#6c4f3f" stroke-width="9" stroke-linejoin="round"/>
  </g>
  <path d="M-31,-20 L-29,-40 L-14,-32Z" fill="#d79f97" opacity=".7"/>

  <g filter="url(#s09_clay)">
   <path d="M-40,4 C-42,-26 -20,-40 0,-40 C20,-40 42,-26 40,4 L50,12 L42,16 L48,24 L38,26 C30,36 16,40 0,40 C-16,40 -30,36 -38,26 L-48,24 L-42,16 L-50,12 Z" fill="url(#s09_hv)"/>
   <ellipse cx="0" cy="9" rx="38" ry="33" fill="url(#s09_mask)"/><ellipse cx="0" cy="13" rx="19" ry="17" fill="#5e4234" opacity=".7"/><path d="M-22,-6 C-10,-2 10,-2 22,-6 C14,6 -14,6 -22,-6Z" fill="#7a5a49" opacity=".35"/>
   <path d="M-4,-36 C-2,-20 2,-20 4,-36Z" fill="#8f6f5c" opacity=".55"/>
  </g>
  <!-- glossy bead eyes -->

   <g id="s09_eL" transform="translate(-15,0)"><ellipse rx="10" ry="10.5" fill="#3b2a22"/><ellipse rx="8.6" ry="9.2" fill="url(#s09_eye)"/><ellipse rx="3.4" ry="6.4" fill="#141018"/><circle cx="-3" cy="-4" r="2.4" fill="#fff"/><circle cx="3" cy="4" r=".9" fill="#fff" opacity=".7"/></g>
   <g id="s09_eR" transform="translate(15,0)"><ellipse rx="10" ry="10.5" fill="#3b2a22"/><ellipse rx="8.6" ry="9.2" fill="url(#s09_eye)"/><ellipse rx="3.4" ry="6.4" fill="#141018"/><circle cx="-3" cy="-4" r="2.4" fill="#fff"/><circle cx="3" cy="4" r=".9" fill="#fff" opacity=".7"/></g>
  </g>
  <g id="s09_lids" fill="none" stroke="#3b2a22" stroke-width="2.4" stroke-linecap="round" opacity="0"><path d="M-25,2 q10,6 20,0"/><path d="M5,2 q10,6 20,0"/></g>
  <!-- Roman nose: a soft bridge, then the nose leather -->
  <path d="M-3,6 C-2,10 2,10 3,6" fill="none" stroke="#a0806c" stroke-width="2" stroke-linecap="round" opacity=".6"/>

  </g>
  <g stroke="#fffaf3" stroke-width="1.1" stroke-linecap="round" opacity=".9"><path d="M-12,20 L-40,16"/><path d="M-12,23 L-38,26"/><path d="M12,20 L40,16"/><path d="M12,23 L38,26"/></g>
  <ellipse cx="-27" cy="16" rx="5" ry="3" fill="#f0a9a0" opacity=".35"/><ellipse cx="27" cy="16" rx="5" ry="3" fill="#f0a9a0" opacity=".35"/>

<script>
(function(){
 var root=document.getElementById('s09');if(!root)return;
 function $(i){return root.querySelector('#s09_'+i)}
 var E={tail:$('tail'),lf:$('lf'),pf:$('pf'),hn:$('hn'),ts:$('ts'),hp:$('hp'),md:$('md'),rf:$('rf'),rg:$('rg'),ln:$('ln'),pn:$('pn'),head:$('head'),eL:$('eL'),eR:$('eR'),lids:$('lids'),mouth:$('mouth'),mc:$('mc'),cat:$('cat'),sh:$('sh'),sh2:$('sh2'),d1:$('d1')};
 // two key poses: A = sitting, B = big stretch (play bow). Numbers lerp between them.
 var A={hn:[342,262,44,38,-8],ts:[304,234,31,52,-12],hp:[322,296],rf:[284,236,24,36],
  lf:[306,250,302,296],ln:[290,252,286,298],head:[286,176,0],
  tail:[378,284,400,300,360,310,300,306]};
 var B={hn:[360,234,44,36,16],ts:[302,258,58,30,12],hp:[362,296],rf:[268,264,20,24],
  lf:[282,268,246,298],ln:[272,272,232,300],head:[272,204,-14],
  tail:[384,228,408,196,404,160,392,128]};
 function L(a,b,t){return a+(b-a)*t}
 function V(a,b,t){var r=[];for(var i=0;i<a.length;i++)r.push(L(a[i],b[i],t));return r}
 function E3(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
 function seg(t,a,b){return Math.max(0,Math.min(1,(t-a)/(b-a)))}
 function bell(t,a,b){var u=seg(t,a,b);return Math.sin(u*Math.PI)}
 function ell(el,v){el.setAttribute('cx',v[0]);el.setAttribute('cy',v[1]);el.setAttribute('rx',v[2]);el.setAttribute('ry',v[3]);el.setAttribute('transform','rotate('+v[4]+' '+v[0]+' '+v[1]+')')}
 function line(el,v){el.setAttribute('x1',v[0]);el.setAttribute('y1',v[1]);el.setAttribute('x2',v[2]);el.setAttribute('y2',v[3])}
 var T=7;
 function pose(t,still){
  // timeline: sit, anticipate, stretch, yawn, sit back with squash, settle, blink
  var s=E3(seg(t,1.5,2.4))-E3(seg(t,3.7,4.4));
  var sq=0.07*bell(t,1.0,1.6)-0.06*bell(t,1.6,2.6)+0.09*bell(t,4.2,4.8)-0.035*bell(t,4.8,5.3)+0.015*bell(t,5.3,5.7);
  var yawn=bell(t,2.5,3.6);yawn=Math.min(1,yawn*1.4);
  var bl=Math.max(bell(t,.55,.8),bell(t,5.9,6.15),bell(t,6.35,6.6),yawn>.15?1:0);
  if(still){s=0;sq=0;yawn=0;bl=0}
  var hn=V(A.hn,B.hn,s),ts=V(A.ts,B.ts,s),rf=V(A.rf,B.rf,s),lf=V(A.lf,B.lf,s),ln=V(A.ln,B.ln,s),hd=V(A.head,B.head,s),tl=V(A.tail,B.tail,s),hp=V(A.hp,B.hp,s);
  ell(E.hn,hn);ell(E.ts,ts);ell(E.md,[(hn[0]+ts[0])/2,(hn[1]+ts[1])/2+2,36,26+8*(1-s),(hn[4]+ts[4])/2]);
  E.hp.setAttribute('cx',hp[0]);E.hp.setAttribute('cy',hp[1]);
  E.d1.setAttribute('cx',hn[0]+14);E.d1.setAttribute('cy',hn[1]-12);
  E.rf.setAttribute('d','M'+(rf[0]-rf[2])+','+(rf[1]-rf[3]*.5)+' C'+(rf[0]-rf[2]*1.1)+','+(rf[1]+rf[3]*.6)+' '+(rf[0]-rf[2]*.3)+','+(rf[1]+rf[3])+' '+(rf[0]+rf[2]*.2)+','+(rf[1]+rf[3]*.9)+' l-4,-6 l6,1 l-3,-7 l7,2 C'+(rf[0]+rf[2]*1.1)+','+(rf[1])+' '+(rf[0]+rf[2]*.6)+','+(rf[1]-rf[3])+' '+(rf[0])+','+(rf[1]-rf[3])+' C'+(rf[0]-rf[2]*.6)+','+(rf[1]-rf[3])+' '+(rf[0]-rf[2])+','+(rf[1]-rf[3]*.8)+' '+(rf[0]-rf[2])+','+(rf[1]-rf[3]*.5)+'Z');
  E.rg.setAttribute('transform','translate('+rf[0]+','+rf[1]+') scale('+(rf[2]/24)+','+(rf[3]/36)+')');
  line(E.lf,lf);line(E.ln,ln);
  E.pf.setAttribute('cx',lf[2]-3);E.pf.setAttribute('cy',lf[3]+1);E.pn.setAttribute('cx',ln[2]-3);E.pn.setAttribute('cy',ln[3]+1);
  E.tail.setAttribute('d','M'+tl[0]+','+tl[1]+' C'+tl[2]+','+tl[3]+' '+tl[4]+','+tl[5]+' '+tl[6]+','+tl[7]);
  var hy=hd[1]-yawn*6,hr=hd[2]-yawn*14;
  E.head.setAttribute('transform','translate('+hd[0]+','+hy+') rotate('+hr+') scale('+(1+sq*.4)+','+(1-sq*.4+yawn*.05)+')');
  var eo=bl>.95?.04:1-bl*.9;
  E.eL.setAttribute('transform','translate(-15,0) scale(1,'+eo+')');E.eR.setAttribute('transform','translate(15,0) scale(1,'+eo+')');
  E.lids.setAttribute('opacity',bl>.6?1:0);
  E.mouth.setAttribute('transform','translate(0,'+(24+yawn*2)+') scale('+(0.6+yawn*.4)+','+yawn+')');
  E.mc.setAttribute('opacity',yawn>.1?0:1);
  // squash and stretch about the floor; tiny stop-motion "boil"
  var f=Math.floor(t*12),j1=(Math.sin(f*12.9898)*43758.5)%1,j2=(Math.sin(f*78.233)*12543.1)%1;
  if(still){j1=0;j2=0}
  var gx=320,gy=300;
  E.cat.setAttribute('transform','translate('+(gx+j1*.5)+','+(gy+j2*.4)+') scale('+(1+sq)+','+(1-sq)+') translate('+(-gx)+','+(-gy)+')');
  var w=1+s*.35;E.sh.setAttribute('rx',62*w*(1+sq));E.sh.setAttribute('cx',330-s*30);E.sh2.setAttribute('rx',40*w*(1+sq));E.sh2.setAttribute('cx',330-s*30);
 }
 var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 if(rm){pose(0,true);return}
 var t0=performance.now()-400,last=-1;
 pose(0.4,false);
function tick(){
  var now=performance.now(),t=((now-t0)/1000)%T,f=Math.floor(t*12);
  if(f!==last){last=f;pose(f/12,false)}
  setTimeout(tick,1000/12);
 }
 setTimeout(tick,1000/12);
})();
</script>
