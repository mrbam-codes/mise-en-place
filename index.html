<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; media-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fcf9f2">
<title>Mise en Place</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23fcf9f2' stroke='%23b48a3c' stroke-width='2'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%23b48a3c' font-family='Georgia'%3EM%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Marcellus&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Champagne: daylight gold on ivory, thin gold rules, engraved small capitals, centred. Bright backgrounds only. */
:root{--ivory:#fcf9f2;--ivory2:#f4ecda;--ink:#2b2417;--body:#4a3f2c;--gold:#b48a3c;--goldd:#8a6626;--goldl:#e4cf9c;--mute:#857353;--card:#fffdf8;--ok:#4f7d2e;--no:#a8452e;
  --disp:'Gloock',Georgia,serif;--caps:'Marcellus',Georgia,serif;--ui:'Figtree',system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html{background:var(--ivory)}
body{margin:0;background:linear-gradient(var(--ivory),var(--ivory2) 60%,var(--ivory));background-attachment:fixed;color:var(--ink);font-family:var(--ui);-webkit-text-size-adjust:100%}
a{color:var(--goldd)}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-left)) 48px max(18px,env(safe-area-inset-right))}
.mast{text-align:center;font:400 12px var(--caps);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin:6px 0 14px}
.hero{position:relative;width:100%;aspect-ratio:420/360;border-radius:26px;overflow:hidden;box-shadow:0 18px 50px -26px #2b241766,0 0 0 1px var(--goldl);isolation:isolate;background:var(--ivory)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;pointer-events:none;padding:18px 20px;display:flex;flex-direction:column;justify-content:space-between;color:var(--hink,#2b2417)}
.ov .s{font:600 11px var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--hsub,#7a6646)}
.ov .d{font:400 clamp(44px,13vw,60px)/1 var(--disp)}
.ov .d small{display:block;font:500 14px/1.35 var(--ui);color:var(--hsub,#4b5563);margin-top:6px;max-width:58%}
.welcome{text-align:center;font:400 21px/1.3 var(--disp);margin:22px 4px 6px;text-wrap:balance}
.prog{margin:14px 0 4px;text-align:center;font:400 11px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.bar{height:4px;border-radius:4px;background:var(--goldl);overflow:hidden;margin:8px auto 0;max-width:280px}.bar i{display:block;height:100%;background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:16px 0 0}
.chips a,.chips button{font:400 12px var(--caps);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--goldd);border:1px solid var(--goldl);background:rgba(255,255,255,.6);border-radius:99px;padding:9px 14px;min-height:40px;display:inline-flex;align-items:center}
.rule{display:flex;align-items:center;gap:10px;color:var(--gold);margin:40px 0 6px;font:400 11px var(--caps);letter-spacing:.24em;text-transform:uppercase;text-align:center}
.rule::before,.rule::after{content:'';flex:1;height:1px;background:var(--goldl)}
.lesson .mod{text-align:center;font:400 11px var(--caps);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin-top:2px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:1px}
h2.t{font:400 27px/1.15 var(--disp);margin:10px 0 8px;text-align:center;text-wrap:balance}
.outcome{text-align:center;font-style:italic;color:var(--mute);font-size:15px;line-height:1.45;margin:0 0 14px}
.fig{border-top:1px solid var(--goldl);border-bottom:1px solid var(--goldl);padding:14px 0;margin:0 -4px}
.fig svg{display:block;width:100%;height:auto;max-height:70vh}
.fig .alt{font-size:12px;color:var(--mute);text-align:center;margin-top:8px;line-height:1.4}
.lesson p,.tryit p,.tryit li{font-size:16px;line-height:1.62;color:var(--body);margin:14px 0 0}
.lesson h3{font:400 13px var(--caps);letter-spacing:.14em;text-transform:uppercase;color:var(--goldd);margin:22px 0 0}
.lesson h3+p{margin-top:6px}
.atwork{margin-top:20px;padding:14px 16px;border:1px solid var(--goldl);border-radius:14px;background:rgba(255,255,255,.55)}
.atwork b{display:block;font:400 11px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px}
.atwork p{margin:0!important;font-size:15px!important}
.take{margin:18px 0 0;text-align:center;font:400 19px/1.35 var(--disp);color:var(--ink)}
.src{font:400 11px var(--caps);letter-spacing:.14em;color:var(--gold);text-transform:uppercase;margin-top:14px;text-align:center;line-height:1.9}
.src a{color:var(--goldd);text-decoration:none;border-bottom:1px solid var(--goldl);padding:6px 0}
.checked{font-size:12px;color:var(--mute);text-align:center;margin-top:6px;line-height:1.4}
.tryit h2,.quizcard h2{font:400 24px/1.2 var(--disp);text-align:center;margin:10px 0 0;text-wrap:balance}
.tryit ol{margin:12px 0 0;padding-left:22px}.tryit li{margin-top:8px}
.tryit .why{font-size:14px;color:var(--mute);text-align:center;margin-top:14px;line-height:1.5}
.quizcard,.reviewcard{text-align:center;border:1px solid var(--goldl);border-radius:18px;padding:22px 18px;background:rgba(255,255,255,.65);margin-top:12px}
.quizcard p,.reviewcard p{color:var(--body);font-size:15px;line-height:1.5;margin:8px 0 0}
.btn{display:block;width:100%;margin-top:14px;min-height:48px;border-radius:99px;border:1px solid var(--gold);background:var(--gold);color:#fff;font:400 15px var(--caps);letter-spacing:.12em;text-transform:uppercase}
.btn.alt{background:#fff;color:var(--goldd);border-color:var(--goldl)}
.news .ng{margin-top:20px}
.news .nh{text-align:center;font:400 12px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--goldd)}
.item{border-bottom:1px solid var(--goldl);padding:14px 0}
.item:last-child{border-bottom:0}
.item h3{font:400 19px/1.25 var(--disp);margin:0}
.item p{font-size:15px;line-height:1.55;color:var(--body);margin:6px 0 0}
.item .so{font-size:14px;color:var(--mute)}
.item .so b{font-weight:600;color:var(--goldd)}
.item a{display:inline-block;font-size:13px;margin-top:6px;padding:6px 0}
.note{text-align:center;font-size:14px;color:var(--mute);margin-top:10px}
.words dl{margin:10px 0 0}.words dt{font:400 18px var(--disp);margin-top:14px}.words dd{margin:2px 0 0;font-size:15px;line-height:1.5;color:var(--body)}
.tool{border:1px solid var(--goldl);border-radius:14px;padding:12px 16px;margin-top:12px;background:rgba(255,255,255,.55)}
.tool b{font:400 18px var(--disp)}.tool .k{font:400 10px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-left:8px}
.tool ul{margin:8px 0 0;padding-left:20px}.tool li{font-size:14px;line-height:1.5;color:var(--body);margin-top:4px}
footer{text-align:center;font-size:13px;color:var(--mute);margin-top:44px;line-height:1.6}
.err{padding:40px 10px;text-align:center;font-size:17px;line-height:1.5}
/* sheets */
.sheet{position:fixed;inset:0;z-index:20;background:var(--ivory);overflow:auto;-webkit-overflow-scrolling:touch}
.sheet .sbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:rgba(252,249,242,.96);border-bottom:1px solid var(--goldl);z-index:1}
.sheet .sbar strong{font:400 12px var(--caps);letter-spacing:.2em;text-transform:uppercase;color:var(--goldd)}
.sheet .close{min-height:44px;padding:0 14px;border-radius:99px;border:1px solid var(--goldl);background:#fff;color:var(--goldd);font:400 13px var(--caps);letter-spacing:.1em}
.sheet .body{max-width:560px;margin:0 auto;padding:18px 18px 60px}
.sheet h2{font:400 26px/1.2 var(--disp);margin:6px 0 10px;text-wrap:balance}
.sheet h3{font:400 12px var(--caps);letter-spacing:.18em;text-transform:uppercase;color:var(--goldd);margin:22px 0 6px}
.meta{font-size:13px;color:var(--mute);line-height:1.5}
.dots{display:flex;gap:6px;margin:10px 0}.dots i{flex:1;height:4px;border-radius:4px;background:var(--goldl)}.dots i.on{background:var(--gold)}.dots i.ok{background:var(--ok)}.dots i.no{background:var(--no)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;margin-top:10px;padding:13px 14px;min-height:52px;border-radius:14px;border:1px solid var(--goldl);background:#fff;font-size:16px;line-height:1.4}
.opt b{font:400 14px var(--caps);color:var(--gold);min-width:16px}
.opt.ok{border-color:var(--ok);background:#eef5e6}.opt.no{border-color:var(--no);background:#fbece6}.opt.dim{opacity:.45}
.why{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--goldl);font-size:15px;line-height:1.5;color:var(--body)}
.score{font:400 64px/1 var(--disp);text-align:center;margin:18px 0 4px}
.pts{text-align:center;color:var(--goldd);font-weight:600}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bd{border:1px solid var(--goldl);border-radius:12px;padding:10px 12px;background:#fff;font-size:13px;color:var(--mute);line-height:1.4}.bd b{display:block;color:var(--ink);font-size:15px}.bd.lock{opacity:.5}.bd.new{border-color:var(--gold);margin-top:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9px,1fr));gap:3px;margin-top:10px}.grid i{aspect-ratio:1;border-radius:2px;opacity:.22}.grid i.d{opacity:1}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--body);margin-top:6px}
input,textarea{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--goldl);background:#fff;margin-top:8px}
textarea{min-height:90px}
.arch a{display:flex;justify-content:space-between;gap:10px;padding:14px 0;border-bottom:1px solid var(--goldl);text-decoration:none;color:var(--ink);font-size:16px}
.arch a span{color:var(--mute);font-size:14px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
</style>
<script src="heroes.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div class="wrap" id="app"><p class="note">Setting the table…</p></div>
<canvas id="fx"></canvas>
<noscript><p class="note">This page needs JavaScript switched on.</p></noscript>
</body>
</html>
